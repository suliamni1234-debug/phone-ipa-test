name: caller
description: "Yellow Fast Call - caller ID and spam protection."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  animated_text_kit: ^4.2.2
  lottie: ^3.1.3
  smooth_page_indicator: ^1.2.0+3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Auth / Phone
  pin_code_fields: ^8.0.1
  intl_phone_field: ^3.2.0
  google_sign_in: ^6.2.2

  # Permissions / Phone
  permission_handler: ^11.3.1
  phone_state: ^2.0.0
  flutter_contacts: ^1.1.9+2
  flutter_phone_direct_caller: ^2.1.1
  call_log: ^5.0.5

  # Location + media
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # Ads
  google_mobile_ads: ^5.2.0

  # Utility
  intl: ^0.20.2
  crypto: ^3.0.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
