workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.8
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Install pods
        script: cd ios && pod install --repo-update
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr caller-unsigned.ipa Payload
    artifacts:
      - caller-unsigned.ipa
